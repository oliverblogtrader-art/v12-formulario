<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>V12 Agência de Marketing | Fale com a gente</title><meta name="theme-color" content="#d10000">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Outfit:wght@500;700;800&display=swap">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{font-family:Outfit,system-ui,sans-serif;color:#111;background:radial-gradient(circle at 80% -10%,#ff4b2b 0,transparent 50%),linear-gradient(180deg,#e10000,#6d0000);background-attachment:fixed;overflow-x:hidden;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body:before{content:"";position:fixed;inset:0;background:repeating-linear-gradient(-60deg,transparent 0 46px,#ffffff0d 46px 50px);pointer-events:none}
main{position:relative;max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 26px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.pill{background:#000;border-radius:14px;padding:6px 14px;display:flex}.pill img{height:34px}
.tag{background:#fff;color:#c20000;font:800 12px Outfit,system-ui,sans-serif;letter-spacing:.06em;padding:7px 12px;border-radius:99px}
.seg{display:flex;gap:6px;margin:16px 0 6px}.seg i{flex:1;height:8px;border-radius:9px;background:#ffffff40;transition:.4s}.seg i.on{background:#fff;box-shadow:0 0 12px #fff8}
.st{color:#ffe;font:700 13px Outfit,system-ui,sans-serif;opacity:.9;margin-bottom:14px}
h1{font:400 clamp(34px,10vw,46px)/1.02 Anton,Impact,sans-serif;text-transform:uppercase;color:#fff;margin-bottom:6px;text-shadow:0 3px 0 #0004}
h1 em{font-style:normal;color:#ffe600}
.hint{color:#ffd9d9;font-weight:600;font-size:15px;margin-bottom:18px}
.q{display:none;flex-direction:column;gap:12px;animation:pop .4s cubic-bezier(.2,1.3,.4,1) both}.q.on{display:flex}
@keyframes pop{from{opacity:0;transform:translateY(26px) scale(.97)}}
.o{display:flex;align-items:center;gap:14px;background:#fff;border:0;border-radius:20px;padding:15px 16px;font:800 19px/1.15 Outfit,system-ui,sans-serif;color:#111;text-align:left;cursor:pointer;box-shadow:0 6px 0 #0005;transition:transform .12s,box-shadow .12s,background .2s}
.o b{font-size:34px;line-height:1;flex:none;width:44px;text-align:center}
.o small{display:block;font:600 13px Outfit,system-ui,sans-serif;color:#777;margin-top:2px}
.o:active{transform:translateY(5px);box-shadow:0 1px 0 #0005}
.o.sel{background:#22d462;color:#04210f;animation:bounce .35s}.o.sel small{color:#0a5a28}
@keyframes bounce{50%{transform:scale(1.04)}}
.sp{flex:1;min-height:14px}
.back{align-self:center;background:none;border:0;color:#fff;opacity:.85;font:700 14px Outfit,system-ui,sans-serif;padding:10px;cursor:pointer}
.foot{text-align:center;color:#ffd0d0;font-size:12px;font-weight:600;margin-top:6px}
input{width:100%;background:#fff;border:3px solid #fff;color:#111;border-radius:18px;padding:17px 18px;font:700 19px Outfit,system-ui,sans-serif;outline:0;box-shadow:0 5px 0 #0005}input:focus{border-color:#ffe600}
.go{justify-content:center;background:#22d462;color:#04210f;font-size:20px;text-align:center}
.err{color:#ffe600;font-weight:700;font-size:14px;text-align:center;min-height:18px}
.conf{position:fixed;left:50%;top:50%;width:10px;height:10px;border-radius:2px;pointer-events:none;z-index:50}
#ov{position:fixed;inset:0;z-index:99;background:radial-gradient(circle at 50% 35%,#2ee66f,#0a7a35 80%);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}#ov.on{display:flex}
.gauge{position:relative;width:min(86vw,340px)}.gauge svg{width:100%}.needle{transform-origin:150px 150px;transform:rotate(-120deg);transition:transform 1.7s cubic-bezier(.2,1.4,.4,1)}
.num{position:absolute;left:0;right:0;top:92px;font:400 clamp(34px,10vw,48px) Anton,Impact;color:#fff}.num small{display:block;font:700 11px Outfit,system-ui,sans-serif;letter-spacing:.2em;color:#eafff0}
#ot{font:400 26px Anton,Impact;margin-top:16px;color:#fff;text-transform:uppercase}#om{margin-top:8px;color:#eafff0;max-width:380px;font-size:16px;font-weight:600}
#pn{position:fixed;inset:0;z-index:120;background:#0b0b0b;color:#f4f4f4;display:none;flex-direction:column;font-family:Outfit,system-ui,sans-serif}#pn.on{display:flex}
#pn header{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + env(safe-area-inset-top,0)) 16px 12px;border-bottom:1px solid #222}#pn header b{font:400 22px Anton,Impact,sans-serif;text-transform:uppercase}#pn header b em{font-style:normal;color:#ff2a2a}
#pn button{font:700 14px Outfit,system-ui,sans-serif;cursor:pointer;border:0;border-radius:12px;padding:10px 14px}.pb2{background:#222;color:#fff}
#lg{display:none;flex-direction:column;gap:12px;padding:24px 16px;max-width:420px;margin:auto;width:100%}#lg input{background:#fff}
#lst{flex:1;overflow:auto;padding:14px 14px 40px;display:flex;flex-direction:column;gap:12px}
.ld{background:#151515;border:1px solid #2a2a2a;border-radius:18px;padding:14px 16px}.ld.ok{opacity:.55}
.ld h3{font:800 19px Outfit,system-ui,sans-serif}.ld .tm{color:#999;font-size:13px;font-weight:600;margin-top:2px}.ld ul{margin:10px 0 12px 18px;color:#ccc;font-size:14px;line-height:1.5}
.ld .ac{display:flex;gap:8px;flex-wrap:wrap}.wa{background:#22d462;color:#04210f;text-decoration:none;font:800 15px Outfit,system-ui,sans-serif;padding:11px 16px;border-radius:12px}
.ld.nv{border:2px solid #ffe600;background:#262100;box-shadow:0 0 22px #ffe60055;animation:glow 1.6s infinite}.nb{display:inline-block;background:#ffe600;color:#000;font:800 11px Outfit,system-ui,sans-serif;letter-spacing:.08em;padding:3px 8px;border-radius:99px;margin-left:8px;vertical-align:middle}@keyframes glow{50%{box-shadow:0 0 34px #ffe600aa}}
.cnt{color:#aaa;font-weight:600;font-size:14px;padding:10px 16px 0}.warn{background:#3a2a00;color:#ffd36b;font-size:13px;font-weight:600;padding:10px 16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

{const d=document.createElement("div");d.className="q";d.innerHTML='<div><h1>Quase lá! <em>Nome</em> e <em>telefone</em></h1><div class="hint">Só isso e já te chamamos no WhatsApp</div></div><input id="nm" placeholder="Seu nome" autocomplete="name"><input id="tl" placeholder="Seu telefone com DDD" inputmode="tel" autocomplete="tel"><button class="o go" id="gb">💬 FALAR COM A V12 AGORA</button><div class="err" id="er"></div>';qs.appendChild(d);d.querySelector("#gb").onclick=()=>{const n=nm.value.trim(),t=tl.value.replace(/\D/g,"");if(n.length<2||t.length<10){er.textContent="Preencha seu nome e telefone com DDD.";return}NM=n;TL=tl.value.trim();finish()}}

if(isN){const y=document.createElement("button");y.className="pb2";y.textContent="✓ Tirar destaque";y.onclick=()=>seeSet([l.id]);ac.append(y)}ac.append(w,m,x);d.append(h,t,u,ac);lst.appendChild(d)})}
let netOK=false,poll=null;const cl=()=>{try{return new Set(JSON.parse(localStorage.getItem("v12_called")||"[]"))}catch(e){return new Set}};
let lastNet=[];
async function load(){try{const r=await fetch("/.netlify/functions/leads",{headers:{"x-pin":"1406"}});if(!r.ok)throw 0;const a=await r.json();netOK=true;wn.hidden=true;const c=cl();lastNet=a.map(l=>({...l,chamado:c.has(l.id)}));render(lastNet)}catch(e){netOK=false;wn.hidden=true;render(lsGet())}}
function startNet(){load();clearInterval(poll);poll=setInterval(load,4000)}
function upd(l,c){if(netOK){const s=cl();(c.chamado?s.add(l.id):s.delete(l.id));try{localStorage.setItem("v12_called",JSON.stringify([...s]))}catch(e){}lastNet=lastNet.map(z=>z.id===l.id?{...z,chamado:c.chamado}:z);render(lastNet);return}if(fdb)fdb.collection("leads").doc(l.id).update(c).catch(()=>{});else{lsSet(lsGet().map(z=>z.id===l.id?{...z,...c}:z));render(lsGet())}}
function del(l){if(netOK){fetch("/.netlify/functions/leads?id="+encodeURIComponent(l.id),{method:"DELETE",headers:{"x-pin":"1406"}}).then(load).catch(()=>{});return}if(fdb)fdb.collection("leads").doc(l.id).delete().catch(()=>{});else{lsSet(lsGet().filter(z=>z.id!==l.id));render(lsGet())}}
